<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tisay Dining | Favorites</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="favorite.css">
  <link rel="icon" href="logo.jpg" type="image/jpeg">
</head>
<body>

  <header class="topbar" id="topbar">
    <a href="home.html" class="logo" aria-label="Tisay Dining home">
      <span class="logo-circle">
        <img src="logo.jpg" alt="Tisay Dining logo">
      </span>
      <span class="logo-text">Tisay Dining</span>
    </a>

    <nav class="nav" aria-label="Main navigation">
      <a href="home.html" class="nav-link">Home</a>
      <a href="about.html" class="nav-link">About Us</a>
      <a href="profile.html" class="profile-link" aria-label="Go to profile">
        <img class="profile-img" id="navProfileImg" src="logo.jpg" alt="Profile picture">
      </a>
    </nav>
  </header>

  <a href="cart.html" class="cart-btn" aria-label="Go to cart">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="9" cy="20" r="1.4"></circle>
      <circle cx="18" cy="20" r="1.4"></circle>
      <path d="M2.5 3.5h2.8l2.4 11.2a1.6 1.6 0 0 0 1.6 1.3h8.2a1.6 1.6 0 0 0 1.6-1.2l1.6-7.3H6.3"></path>
    </svg>
    <span class="cart-count" id="cartCount">0</span>
  </a>

  <main class="content">
    <h1 class="section-title">Favorites</h1>
    <section class="dish-grid" id="favoriteGrid">
      <div class="fav-empty"><p>Loading your favorites...</p></div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="favorite.js"></script>
</body>
</html>
