<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Favorites - Tisay Dining</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css">
</head>
<body>

  <header class="topbar">
    <div class="logo">
      <a href="home.html" class="back-link">← Back to Menu</a>
      <span class="logo-text">My Favorite Dishes</span>
    </div>
  </header>

  <main class="content">
    <h1 class="section-title">Saved Favorites</h1>
    <div class="dish-grid" id="favoritesContainer">
      <div class="dish-card">
        <div class="dish-img-wrap">
          <img src="dish1.jpg" alt="Special Pork Adobo">
        </div>
        <div class="dish-info">
          <h3>Special Pork Adobo</h3>
          <p class="dish-desc">Tender pork simmered in rich soy sauce, vinegar, and garlic.</p>
          <div class="dish-footer">
            <span class="dish-price">₱180.00</span>
            <button class="fav-icon-btn clicked" aria-label="Favorite">
              <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
