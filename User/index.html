<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <link rel="icon" href="logo.jpg" type="image/jpeg">
</head>
<body>

  <main class="auth-card">
    <div class="auth-header">
      <div class="logo-circle">
        <img src="logo.jpg" alt="Logo">
      </div>
      <h1 class="auth-title">Log In</h1>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="username">Username / Email</label>
        <div class="input-wrap">
          <input class="form-input" type="text" id="username" placeholder="Enter your email" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <div class="input-wrap">
          <input class="form-input has-icon" type="password" id="loginPassword" placeholder="Enter your password" required>
          <button type="button" class="eye-btn" data-target="loginPassword" aria-label="Toggle password visibility"></button>
        </div>
      </div>

      <button type="submit" class="primary-btn">Log In</button>
    </form>

    <div class="auth-footer">
      <a href="forgot.html" id="forgotLink" class="auth-link">Forgot password?</a>
      <p>Don't have an account? <a href="sign.html" class="auth-link">Sign up</a></p>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="index.js"></script>
</body>
</html>
