<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Requests</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="request.css">
  <link rel="icon" href="logo.jpg" type="image/jpeg">
</head>
<body>

  <header class="topbar" id="topbar">
    <a href="admin.html" class="logo" aria-label="Admin Dashboard">
      <span class="logo-circle">
        <img src="logo.jpg" alt="Logo">
      </span>
      <span class="logo-text">Admin Portal</span>
    </a>

    <nav class="nav" aria-label="Main navigation">
    </nav>
  </header>

  <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <path d="M4 7h16M4 12h16M4 17h10"></path>
    </svg>
    <span>Menu</span>
  </button>

  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar" aria-label="Navigation">
    <div class="sidebar-head">
      <h2>Navigation</h2>
    </div>

    <ul class="category-list">
      <li><a href="admin.html" class="category">Dashboard</a></li>
      <li><a href="dish.html" class="category">Dishes</a></li>
      <li><a href="request.html" class="category active">Pending Request</a></li>
      <li><a href="history.html" class="category">History</a></li>
    </ul>

    <div class="sidebar-user">
      <img class="user-img" src="logo.jpg" alt="Admin">
      <span class="user-name">Admin</span>
      <button class="logout-btn" id="logoutBtn" type="button" aria-label="Log out" title="Log out">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <path d="M16 17l5-5-5-5"></path>
          <path d="M21 12H9"></path>
        </svg>
      </button>
    </div>
  </aside>

  <main class="content">
    <h1 class="section-title">Pending Order Requests</h1>
    <div class="requests-container" id="requestsContainer"></div>
  </main>

  <div class="modal" id="orderModal" role="dialog" aria-modal="true">
    <div class="detail-card">
      <div class="detail-header">
        <div>
          <h2 id="modalCustomerName">Customer Name</h2>
          <p id="modalOrderTime">Time</p>
        </div>
        <button type="button" class="close-modal-btn" id="closeModalBtn" aria-label="Close details">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6L6 18M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <div>
        <h3 class="detail-section-title">Customer Information</h3>
        <div class="detail-info-grid">
          <div class="detail-info-item">
            <span>Contact Number</span>
            <strong id="modalCustomerContact">09123456789</strong>
          </div>
          <div class="detail-info-item">
            <span>Address</span>
            <strong id="modalCustomerAddress">Address</strong>
          </div>
        </div>
      </div>

      <div>
        <h3 class="detail-section-title">Ordered Items</h3>
        <div class="detail-items-list" id="modalItemsList"></div>
      </div>

      <div class="detail-footer">
        <div>
          <span style="font-size: 0.82rem; color: var(--text-muted); display: block;">Total Payment</span>
          <span class="detail-total-amount" id="modalTotalAmount">₱0.00</span>
        </div>
        <div class="request-action">
          <button type="button" class="action-btn accept-btn" id="modalAcceptBtn">Accept</button>
          <button type="button" class="action-btn decline-btn" id="modalDeclineBtn">Decline</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="request.js"></script>
</body>
</html>
