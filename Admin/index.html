<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
</head>
<body>

  <main class="auth-card">
    <div class="auth-header">
      <div class="logo-circle">
        <img src="logo.jpg" alt="Logo">
      </div>
      <h1 class="auth-title">Admin Portal</h1>
    </div>

    <form id="adminLoginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="adminUsername">Username</label>
        <div class="input-wrap">
          <input class="form-input" type="text" id="adminUsername" placeholder="admin" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="adminPassword">Password</label>
        <div class="input-wrap">
          <input class="form-input has-icon" type="password" id="adminPassword" placeholder="admin123" required>
          <button type="button" class="eye-btn" data-target="adminPassword" aria-label="Toggle password visibility"></button>
        </div>
      </div>

      <button type="submit" class="primary-btn">Log In</button>
    </form>
  </main>

  <div class="modal" id="alertModal" role="alertdialog" aria-modal="true" aria-labelledby="alertTitle" aria-describedby="alertMessage">
    <div class="alert-card" id="alertCard">
      <div class="alert-icon">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path>
          <path d="M12 9v4M12 17h.01"></path>
        </svg>
      </div>
      <h2 id="alertTitle"></h2>
      <p id="alertMessage"></p>
      <span class="alert-timer" id="alertTimer" hidden></span>
      <button type="button" class="primary-btn" id="alertClose">OK</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="index.js"></script>
</body>
</html>
